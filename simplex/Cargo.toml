[package]
build = "build.rs"
name = "rstopo-simplex"

authors.workspace = true
categories.workspace = true
description.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[features]
default = ["std"]

full = ["default", "rand", "serde"]

# ********* [FF] Dependencies *********
alloc = ["rstopo-core/alloc", "num/alloc", "serde?/alloc"]

rand = ["num/rand", "rstopo-core/rand"]

serde = ["dep:serde", "rstopo-core/serde"]

# ********* [FF] Environments *********
std = ["rstopo-core/std", "alloc", "num/std", "serde?/std"]

wasm = []

wasi = []

[lib]
bench = true
crate-type = ["cdylib", "rlib"]
doctest = false
test = true

[build-dependencies]

[dependencies]
rstopo-core.workspace = true

nalgebra ={ version = "0.33" }
ndarray = { default-features = false, workspace = true }
ndarray-linalg = "0.16"
num.workspace = true
serde = { default-features = false, optional = true, workspace = true }
smart-default.workspace = true
strum.workspace = true


[dev-dependencies]
lazy_static.workspace = true

[package.metadata.docs.rs]
all-features = true
rustc-args = ["--cfg", "docsrs"]

[target.wasm32-unknown-unknown.dependencies]

[target.wasm32-wasi]

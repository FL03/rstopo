[workspace]
default-members = [
    "rstopo"
]

exclude = [

]

members = [
    "core",
    "rstopo",
    "simplex",
]

resolver = "3"

[workspace.dependencies]
rstopo-core = { default-features = false, path = "./core", version = "0.0.1" }

anyhow = "1"
lazy_static = "1"
ndarray = { default-features = false, version = "0.16" }
num = { default-features = false, version = "0.4" }
paste = "1"
serde = { default-features = false, features = ["derive"], version = "1" }
serde_derive = "1"
smart-default = "0.7"
strum = { default-features = false, features = ["derive"], version = "0.26" }
thiserror = { default-features = false, version = "2" } 

[workspace.package]
authors = ["FL03 <jo3mccain@icloud.com> (https://github.com/FL03)", "Scattered-Systems <support@scsys.io> (https://github.com/scattered-systems)"]
categories = [ "science" ]
description = "rstopo"
edition = "2024"
homepage = "https://github.com/FL03/rstopo/wiki"
keywords = ["mathematics", "topology", "toolkit"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/FL03/rstopo"
version = "0.0.1"


[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = false
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false
